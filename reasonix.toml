_classify_tool(tool_name, tool_input):\n    name_lower = tool_name.lower()\n    _SUBAGENT_TOOLS = {\"task\", \"Task\", \"delegate\", \"subagent\"}\n    _SKILL_TOOLS = {\"skill\", \"run_skill\", \"use_skill\"}\n    _MCP_PREFIX = \"mcp__\"\n    if tool_name.startswith(_MCP_PREFIX):\n        return \"mcp\", f\"MCP: {tool_name}\"\n    if name_lower in _SUBAGENT_TOOLS or \"task\" in name_lower:\n        return \"subagent\", f\"Subagent: {tool_name}\"\n    if name_lower in _SKILL_TOOLS or \"skill\" in name_lower:\n        return \"skill\", f\"Skill: {tool_name}\"\n    if isinstance(tool_input, dict):\n        if tool_input.get(\"subagent_type\") or tool_input.get(\"subagent_name\"):\n            return \"subagent\", f\"Subagent: {tool_name}\"\n        if tool_input.get(\"skill\") or tool_input.get(\"skill_name\"):\n            return \"skill\", f\"Skill: {tool_name}\"\n    return \"tool_call\", tool_name\n\ndef _first_input_value(tool_input):\n    if not isinstance(tool_input, dict) or not tool_input: return \"\"\n    for key in (\"file_path\", \"path\", \"query\", \"pattern\", \"command\", \"url\", \"message\"):\n        if key in tool_input:\n            val = tool_input[key]\n            if isinstance(val, str) and val: return val[:80]\n    for v in tool_input.values():\n        if isinstance(v, str) and v: return v[:80]\n    return \"\"\n\ndef to_str(x):\n    return str(x) if x is not None else \"\"\n\nsteps = []\nseq = 0\ncurrent_step = 0\npending_tools = {}\n\nfor evt in raw:\n    etype = evt.get(\"type\", \"\")\n    if etype == \"session.start\":\n        seq += 1\n        model = evt.get(\"model\", \"\")\n        steps.append(ReplayStep(seq=seq, category=\"system\", title=\"Session start\", content=f\"Model: {model}\" if model else \"\"))\n    elif etype == \"session.end\":\n        seq += 1\n        steps.append(ReplayStep(seq=seq, category=\"result\", title=\"Session end\"))\n    elif etype == \"text.user\":\n        text = evt.get(\"text\", \"\")\n        if text.strip():\n            seq += 1\n            steps.append(ReplayStep(seq=seq, category=\"user_input\", title=text[:60], content=text))\n    elif etype == \"step.start\":\n        current_step = evt.get(\"globalStep\", current_step + 1)\n    elif etype == \"step.finish\":\n        pass\n    elif etype == \"text.assistant\":\n        text = evt.get(\"text\", \"\")\n        if text.strip():\n            seq += 1\n            steps.append(ReplayStep(seq=seq, category=\"llm_text\", title=text[:60], content=text, turn_no=current_step))\n    elif etype == \"tool.start\":\n        tid = evt.get(\"toolCallId\", \"\")\n        tool_name = evt.get(\"tool\", \"unknown\")\n        tool_input = evt.get(\"input\") or {}\n        pending_tools[tid] = {\"name\": tool_name, \"input\": tool_input, \"step\": current_step, \"ts\": evt.get(\"ts\", 0)}\n    elif etype == \"tool.finish\":\n        tid = evt.get(\"toolCallId\", \"\")\n        start_info = pending_tools.pop(tid, {})\n        tool_name = start_info.get(\"name\", evt.get(\"tool\", \"unknown\"))\n        tool_input = start_info.get(\"input\", evt.get(\"input\", {}))\n        is_err = bool(evt.get(\"isError\", False))\n        output_text = to_str(evt.get(\"output\", \"\"))\n        category, _ = _classify_tool(tool_name, tool_input)\n        seq += 1\n        title = tool_name\n        first_val = _first_input_value(tool_input)\n        if first_val: title = f\"{tool_name}({first_val[:40]})\"\n        steps.append(ReplayStep(seq=seq, category=\"error\" if is_err else category,\n                                title=title, content=output_text, turn_no=current_step,\n                                is_error=is_err,\n                                detail={\"tool_name\": tool_name, \"tool_input\": tool_input, \"tool_id\": tid}))\n\nprint(f'Total replay steps: {len(steps)}')\nfor s in steps:\n    print(f'  #{s.seq:2d} [Step {s.turn_no}] [{s.category:12s}] {s.title[:70]}')\n\nfrom collections import Counter\ncats = Counter(s.category for s in steps)\nprint(f'\\nCategory distribution: {dict(cats)}')\nPYEOF"]
