\"},\n}\n\ndef _first_input_value(tool_input):\n    if not isinstance(tool_input, dict) or not tool_input:\n        return \"\"\n    for key in (\"file_path\", \"path\", \"query\", \"pattern\", \"command\", \"url\", \"message\"):\n        if key in tool_input:\n            val = tool_input[key]\n            if isinstance(val, str) and val:\n                return val[:80]\n    for v in tool_input.values():\n        if isinstance(v, str) and v:\n            return v[:80]\n    return \"\"\n\ndef to_str(x):\n    return str(x) if x is not None else \"\"\n\nsteps = []\nseq = 0\ncurrent_turn = 0\nfor evt in raw:\n    etype = evt.get(\"type\", \"\")\n    if etype == \"system\":\n        seq += 1\n        model = evt.get(\"model\", \"\")\n        tools = evt.get(\"tools\", [])\n        tool_names = [(t.get(\"name\", str(t)) if isinstance(t, dict) else str(t)) for t in tools]\n        steps.append(ReplayStep(seq=seq, category=\"system\", title=\"Session init\",\n                                content=f\"Model: {model}, Tools: {tool_names}\"))\n    elif etype == \"assistant\":\n        msg = evt.get(\"message\") or {}\n        if not isinstance(msg, dict): continue\n        current_turn += 1\n        usage = msg.get(\"usage\") or {}\n        raw_content = msg.get(\"content\", [])\n        if isinstance(raw_content, str):\n            raw_content = [{\"type\": \"text\", \"text\": raw_content}]\n        for block in raw_content:\n            if not isinstance(block, dict): continue\n            btype = block.get(\"type\", \"\")\n            if btype == \"text\":\n                text = block.get(\"text\", \"\")\n                if text.strip():\n                    seq += 1\n                    steps.append(ReplayStep(seq=seq, category=\"llm_text\", title=text[:60], content=text, turn_no=current_turn))\n            elif btype == \"tool_use\":\n                tool_name = block.get(\"name\", \"unknown\")\n                tool_input = block.get(\"input\") or {}\n                